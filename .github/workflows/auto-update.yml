name: Auto Update Dashboard Data

on:
  # 每个工作日 UTC 10:00（北京时间 18:00）自动运行
  schedule:
    - cron: '0 10 * * 1-5'
  # 支持手动触发
  workflow_dispatch:
    inputs:
      full_mode:
        description: '全量模式（重新拉取近 5 年数据）'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Run auto-update script
        run: |
          FULL_FLAG=""
          if [ "${{ github.event.inputs.full_mode }}" = "true" ]; then
            FULL_FLAG="--full"
          fi
          python auto_update.py --skip-git --skip-time-check $FULL_FLAG
        working-directory: .

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard_data.js data/screening_results.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update dashboard data $(date +%Y-%m-%d)"
            git push
            echo "Changes pushed. Vercel will auto-deploy."
          fi
